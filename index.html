layout: null
title: 신나는 수학 놀이터
---
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="자릿수를 골라 덧셈과 뺄셈을 연습하는 어린이 수학 게임">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/math-game.css' | relative_url }}">
</head>
<body>
  <div class="sky-decoration decoration-one" aria-hidden="true">☁️</div>
  <div class="sky-decoration decoration-two" aria-hidden="true">⭐</div>
  <main class="game-card">
    <header>
      <div class="mascot" aria-hidden="true">🦊</div>
      <div><p class="eyebrow">오늘도 한 문제씩 차근차근!</p><h1>신나는 수학 놀이터</h1></div>
    </header>
    <section class="score-board" aria-label="학습 결과">
      <div><span>⭐ 맞힌 문제</span><strong id="correct-count">0</strong></div>
      <div><span>🌱 틀린 문제</span><strong id="wrong-count">0</strong></div>
      <div><span>💛 남은 기회</span><strong id="chances">3</strong></div>
    </section>
    <section class="type-selector" aria-labelledby="type-title">
      <div class="type-heading"><span class="type-icon" aria-hidden="true">🎯</span><div><h2 id="type-title">어떤 문제를 풀까요?</h2><p>두 숫자의 자릿수를 골라 보세요.</p></div></div>
      <div class="digit-selectors">
        <label><span>첫 번째 숫자</span><select id="first-digits"><option value="1">한 자리</option><option value="2" selected>두 자리</option><option value="3">세 자리</option></select></label>
        <span class="selector-symbol" aria-hidden="true">➕➖</span>
        <label><span>두 번째 숫자</span><select id="second-digits"><option value="1">한 자리</option><option value="2" selected>두 자리</option><option value="3">세 자리</option></select></label>
      </div>
      <p class="type-note">자릿수를 바꾸면 새 문제가 나와요. 뺄셈은 큰 수가 앞으로 와요!</p>
    </section>
    <section class="problem-area" aria-live="polite">
      <p class="guide"><span aria-hidden="true">✏️</span> 아래 문제를 풀어 보세요</p>
      <div class="problem">
        <span id="left" class="number">?</span><span id="operator" class="symbol">+</span><span id="right" class="number">?</span><span class="symbol">=</span>
        <label class="answer-box"><span class="answer-label">내 답</span><input id="answer" type="number" min="0" inputmode="numeric" aria-label="정답" autocomplete="off" placeholder="?"></label>
      </div>
      <button id="submit-button" type="button"><span aria-hidden="true">🙌</span> 정답 확인</button>
      <p id="message" class="message">문제를 준비하고 있어요...</p><p id="time" class="time"></p>
      <button id="next-button" type="button" class="secondary" hidden>다음 문제 <span aria-hidden="true">➡️</span></button>
    </section>
  </main>
  <script src="{{ '/assets/js/math-game.js' | relative_url }}" defer></script>
</body>
</html>
